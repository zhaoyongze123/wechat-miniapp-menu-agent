# 一个 A 机、一个后台实例和一个本机卷；所有采集端经 HTTP API 使用同一状态。
name: menu-capture
services:
  hub:
    build:
      context: ../..
      dockerfile: deploy/hub/Dockerfile.hub
      args:
        VERSION: "${MENU_CAPTURE_VERSION:-0.1.0}"
    # 固定镜像标签便于按发布版本升级与回滚：MENU_CAPTURE_IMAGE=menu-capture-hub:<版本>。
    image: "${MENU_CAPTURE_IMAGE:-menu-capture-hub:local}"
    restart: unless-stopped
    init: true
    environment:
      MENU_CAPTURE_ADMIN_PASSWORD: "${MENU_CAPTURE_ADMIN_PASSWORD:?请在 deploy/hub/.env 中填写管理员口令}"
      MENU_CAPTURE_ALLOWED_HOSTS: "${MENU_CAPTURE_ALLOWED_HOSTS:-}"
      # 宿主机更新执行器地址与令牌：未配置时设置页只展示原因，不提供安装入口。
      HUB_UPDATE_URL: "${HUB_UPDATE_URL:-}"
      HUB_UPDATE_TOKEN: "${HUB_UPDATE_TOKEN:-}"
      # 合格成品目录：挂载根本身，由服务在其下按 项目/<code>/合格 生成交付路径。
      # 首次部署会自动初始化历史存量，无需重新采集；未自定义时落在 compose 同级的 delivery 目录。
      MENU_CAPTURE_DELIVERY_ROOT: "/var/lib/menu-delivery"
      MENU_CAPTURE_DELIVERY_HOST_PATH: "${MENU_CAPTURE_DELIVERY_MOUNT:-./delivery}"
      MENU_CAPTURE_DELIVERY_POLL_SECONDS: "${MENU_CAPTURE_DELIVERY_POLL_SECONDS:-5}"
    extra_hosts:
      # 执行器跑在宿主机，容器通过 host-gateway 访问；仍需执行器令牌与来源网段校验。
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${MENU_CAPTURE_HOST_PORT:-8766}:8765"
    volumes:
      - hub-data:/var/lib/menu-capture
      # 交付目录必须是 Bind Mount：命名卷在宿主机上不可见，无法作为成品交付目录。
      # 生产设置 MENU_CAPTURE_DELIVERY_MOUNT=D:/MenuCapture，最终交付路径为 D:/MenuCapture/项目/<code>/合格。
      # 暂存与回收目录位于挂载根下（.menu-capture-staging/.menu-capture-trash），不进入交付目录。
      - "${MENU_CAPTURE_DELIVERY_MOUNT:-./delivery}:/var/lib/menu-delivery"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/healthz', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
volumes:
  hub-data: {}
