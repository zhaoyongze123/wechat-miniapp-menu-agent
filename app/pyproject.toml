[project]
name = "menu-capture"
version = "0.1.0"
description = "微信小程序菜单采集：Windows Worker、共享 Hub 与 React 管理台"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "opencv-python-headless>=4.10,<5; sys_platform != 'win32'",
  "opencv-python>=4.10,<5; sys_platform == 'win32'",
  "rapidocr-onnxruntime==1.4.4; sys_platform == 'win32'",
  "zxing-cpp==3.1.1; sys_platform == 'win32'",
  "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Vision>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=11,<13; sys_platform == 'darwin'",
  "screeninfo>=0.8.1,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# 只检查 Python 服务端、测试与脚本；前端源码与 Node 适配层由各自工具链负责。
target-version = "py312"
line-length = 120
extend-exclude = [
    "web",
    "web-react",
    "ui_tars",
    "qr_detector",
    "data",
    "output",
]

[tool.ruff.lint]
# 门禁先只拦截真实缺陷（语法错误、未定义名、无效比较、无效 f-string）。
# 历史存量的风格类问题按 Issue #28 约定逐步治理，不一次性全量格式化。
select = ["E9", "F63", "F7", "F82"]
ignore = ["E501"]
