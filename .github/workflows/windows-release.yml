# 本轮开发完成后集中手动验收一次。失败后先本地修复，重跑须用户授权。
# PR、提交、合并和标签推送不会触发。正式发布和生产部署另行授权。
name: Windows 采集端与共享后台（手动集成验收）
on:
  workflow_dispatch:
    inputs:
      version:
        description: 安装包版本
        default: '0.1.0'
        required: true
        type: string
      create_release:
        description: 验收通过后用同一次产物创建或更新 Release 草稿
        default: false
        required: true
        type: boolean
      min_supported_version:
        description: 更新清单中的最低兼容版本（低于该版本不提供应用内更新）
        default: '0.2.0'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  react-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web-react/package-lock.json
      - name: 校验 React 底座、单测与提交的构建产物
        working-directory: app/web-react
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint:design
          npm test
          npm run build
          if [ -n "$(git status --porcelain ../web/react)" ]; then
            echo "web/react 产物与源码不一致，请本地重新构建并提交"
            git status --short ../web/react
            exit 1
          fi
      - name: 校验旧前端已清理且发布产物自包含
        working-directory: app
        run: |
          legacy=$(find web -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' -o -name 'index.html' \) -print)
          if [ -d web/vue ]; then legacy="$legacy web/vue"; fi
          if [ -d web-ui ]; then legacy="$legacy web-ui"; fi
          if [ -n "$legacy" ]; then
            echo "旧前端文件仍在仓库中，请完成清理："
            echo "$legacy"
            exit 1
          fi
          if grep -Eq 'https?://|/react/assets/|__CAPTURE_TOKEN__' web/react/index.html; then
            echo "React 入口包含外部依赖、迁移期资源前缀或旧令牌占位符"
            exit 1
          fi
          test -s web/react/.vite/manifest.json

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
      - name: Ruff 门禁（配置见 pyproject.toml）
        working-directory: app
        run: uvx ruff@0.17.6 check --no-cache .
      - name: 全量通用测试（unit / integration / contract）
        working-directory: app
        run: |
          uv sync --frozen --python 3.12
          # 不再手工维护文件名清单：新增测试随目录自动纳入门禁。
          uv run --frozen pytest -q tests/unit tests/integration tests/contract

  windows:
    # 后端门禁与前端门禁都通过后才开始昂贵的平台构建与验收。
    needs: [backend-check, react-web]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
      - name: Windows 原生执行契约
        shell: pwsh
        working-directory: app
        run: |
          uv sync --frozen --python 3.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 通用单测、集成测试与目录级契约已在后端门禁全量执行；这里只补充 Windows 本机行为。
          uv run --frozen pytest -q --basetemp (Join-Path $env:RUNNER_TEMP 'mc-py') tests/contract
      - name: 锁定 Velopack CLI 1.2.161
        shell: pwsh
        run: |
          # vpk 与 Python SDK 必须同为 1.2.161，避免安装包与更新元数据由不同版本生成。
          dotnet tool install -g vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) {
            dotnet tool update -g vpk --version 1.2.161 --allow-downgrade
            if ($LASTEXITCODE -ne 0) { throw 'vpk 1.2.161 安装失败。' }
          }
          $vpk = Join-Path $env:USERPROFILE '.dotnet\tools\vpk.exe'
          if (-not (Test-Path -LiteralPath $vpk)) { throw 'vpk 未安装到预期位置。' }
          $reported = (& $vpk --version | Out-String).Trim()
          Write-Host "vpk $reported"
          if ($reported -notmatch '1\.2\.161') { throw "vpk 版本不是 1.2.161：$reported" }
          # 后续脚本按 PATH 解析 vpk；同一作业内保持一致。
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: 构建 Windows x64 安装包（Velopack）
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version || '0.1.0' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $version = $env:BUILD_VERSION
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          # 产物只包含本次版本：Setup、full/delta nupkg 与对应渠道的 releases JSON；
          # 历史包仅用于生成 delta，由构建脚本在临时目录下载，不进入发布资产。
          ./deploy/windows/build.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: menu-capture-windows-x64
          path: deploy/artifacts/
          if-no-files-found: error
          retention-days: 14

  hub:
    needs: backend-check
    runs-on: ubuntu-latest
    # 仅向 GHCR 推送本仓库镜像；不授予无关写权限。
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 生成隔离环境口令
        run: echo "MENU_CAPTURE_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: 设置共享后台发布标签
        env:
          INPUT_VERSION: ${{ inputs.version || '0.1.0' }}
        run: |
          version="$INPUT_VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          echo "MENU_CAPTURE_VERSION=$version" >> "$GITHUB_ENV"
          echo "MENU_CAPTURE_IMAGE=menu-capture-hub:$version" >> "$GITHUB_ENV"
      - name: 验证共享后台容器、前端产物和数据卷
        # 有效包写权限、登录和图层上传均成功；失败后 GHCR 只留下 SLSA in-toto attestation，目标镜像 manifest/index 不存在。
        # 当前 OTA 不验证 BuildKit 默认 provenance，而校验固定仓库、Release 清单和镜像 digest；仅关闭这项未消费的隐式元数据。
        # 保留 packages:write 最小权限、固定仓库、版本标签预检及 digest 校验。
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
        run: |
          # Bind Mount 由宿主机创建；Linux 运行器需授予容器用户 10001 写权限。
          mkdir -p deploy/hub/delivery && chmod 777 deploy/hub/delivery
          docker compose -f deploy/hub/compose.yaml up -d --build --wait
          curl --fail http://127.0.0.1:8766/healthz
          auth="admin:$MENU_CAPTURE_ADMIN_PASSWORD"
          curl --fail -u "$auth" http://127.0.0.1:8766/ | grep -q '<div id="root"></div>'
          curl --fail -u "$auth" http://127.0.0.1:8766/api/version | jq -e --arg version "$MENU_CAPTURE_VERSION" '.version == $version and (.frontend | length > 0)'
          entry=$(curl --fail -u "$auth" http://127.0.0.1:8766/ | grep -o '/assets/[^"]*\.js' | head -n1)
          test -n "$entry" && curl --fail -u "$auth" -o /dev/null "http://127.0.0.1:8766$entry"
          curl --fail -u "$auth" -o /dev/null http://127.0.0.1:8766/favicon.svg
          docker compose -f deploy/hub/compose.yaml exec -T hub tesseract --list-langs | grep -w chi_sim
          docker compose -f deploy/hub/compose.yaml exec -T hub test -s /var/lib/menu-capture/data/tasks.sqlite3
      - name: 验证合格成品目录隔离初始化
        run: |
          # 交付目录必须落在宿主机 Bind Mount，且服务在空库下也能正常初始化而不是报不可写。
          auth="admin:$MENU_CAPTURE_ADMIN_PASSWORD"
          status=$(curl --silent --fail -u "$auth" http://127.0.0.1:8766/api/delivery/status)
          jq -e '.configured == true and .state != "error"' <<< "$status"
          test -d deploy/hub/delivery/合格
      - name: 验证共享后台原地升级与回滚
        if: github.event_name == 'workflow_dispatch'
        env:
          BASELINE_REF: e6b7ea82079b45f1720ea6dec6411bc29ed5276b
          MENU_CAPTURE_HOST_PORT: '18777'
        run: |
          git fetch --depth 1 origin "$BASELINE_REF"
          git worktree add --detach "$RUNNER_TEMP/hub-old" "$BASELINE_REF"
          # 基线提交是旧目录布局，按实际检出位置定位 Dockerfile，避免历史路径变化导致验收失效。
          baseline_dockerfile=$(find "$RUNNER_TEMP/hub-old" -path '*/deploy/*' -name 'Dockerfile.hub' | head -1)
          docker build -t menu-capture-hub:upgrade-baseline -f "$baseline_dockerfile" "$RUNNER_TEMP/hub-old"
          compose=(docker compose -p menu-capture-upgrade -f deploy/hub/compose.yaml)
          candidate="$MENU_CAPTURE_IMAGE"
          base="http://127.0.0.1:$MENU_CAPTURE_HOST_PORT"
          auth="admin:$MENU_CAPTURE_ADMIN_PASSWORD"
          MENU_CAPTURE_IMAGE=menu-capture-hub:upgrade-baseline "${compose[@]}" up --no-build -d --wait
          session=$(curl --silent --fail -u "$auth" "$base/api/session" | jq -er '.token')
          code=$(curl --silent --fail -u "$auth" -X POST -H "X-Capture-Token: $session" "$base/api/shared/pairing" | jq -er '.code')
          paired=$(curl --silent --fail -H 'Content-Type: application/json'             --data "$(jq -nc --arg code "$code" '{code:$code,name:"升级验收设备"}')" "$base/api/shared/worker/pair")
          id=$(jq -er '.id' <<< "$paired")
          token=$(jq -er '.token' <<< "$paired")
          verify_worker() {
            curl --silent --fail -u "$auth" "$base/api/shared/status" | jq -e --arg id "$id" '.workers | any(.id == $id)'
            curl --silent --fail -H "Authorization: Bearer $token" -H 'Content-Type: application/json'               --data '{"ready_ids":[],"pending_uploads":0}' "$base/api/shared/worker/sync" | jq -e 'has("assignments")'
          }
          MENU_CAPTURE_IMAGE="$candidate" "${compose[@]}" up --no-build -d --wait
          verify_worker
          curl --silent --fail -u "$auth" "$base/api/version" | jq -e --arg version "$MENU_CAPTURE_VERSION" '.version == $version'
          MENU_CAPTURE_IMAGE=menu-capture-hub:upgrade-baseline "${compose[@]}" up --no-build -d --wait
          verify_worker
          "${compose[@]}" down -v
      - name: Hub 更新执行器契约单测
        run: |
          python3 -m venv "$RUNNER_TEMP/updater-venv"
          "$RUNNER_TEMP/updater-venv/bin/pip" install --quiet pytest
          "$RUNNER_TEMP/updater-venv/bin/python" -m pytest -q deploy/hub-update/test_hub_updater.py
      - name: 验收 Hub 宿主机更新执行器（隔离 Compose）
        if: github.event_name == 'workflow_dispatch'
        env:
          MENU_CAPTURE_HOST_PORT: '18788'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 基线直接使用 v0.2.2 正式发布镜像（不重新打包），覆盖“生产 0.2.2 → 新版 → 回滚 0.2.2”
          # 的真实跨版本场景，并验证旧版本能在新版本迁移过的数据库上启动（回滚兼容性）。
          base_version=0.2.2
          project=menu-capture-updater
          compose=(docker compose -p "$project" -f deploy/hub/compose.yaml)
          baseline_dir="$RUNNER_TEMP/baseline"
          mkdir -p "$baseline_dir"
          gh release download "v$base_version" --repo "$GITHUB_REPOSITORY" \
            --pattern "menu-capture-hub-$base_version-linux-amd64.tar.gz" --dir "$baseline_dir"
          docker load -i "$baseline_dir/menu-capture-hub-$base_version-linux-amd64.tar.gz"
          docker image inspect "menu-capture-hub:$base_version" > /dev/null

          state="$RUNNER_TEMP/hub-updater"
          mkdir -p "$state/archives"
          MENU_CAPTURE_IMAGE="menu-capture-hub:$base_version" "${compose[@]}" up --no-build -d --wait
          # 业务数据标记：切换与回滚后必须原样保留。
          "${compose[@]}" exec -T hub sh -c 'echo hub-sentinel > /var/lib/menu-capture/ota-sentinel'

          archive="hub-image-$MENU_CAPTURE_VERSION.tar.gz"
          docker image save "$MENU_CAPTURE_IMAGE" | gzip -c > "$state/archives/$archive"
          size=$(stat -c%s "$state/archives/$archive")
          sha=$(sha256sum "$state/archives/$archive" | cut -d' ' -f1)

          export HUB_UPDATE_TOKEN=$(openssl rand -hex 24)
          export HUB_UPDATE_COMPOSE_FILE="$PWD/deploy/hub/compose.yaml"
          export HUB_UPDATE_PROJECT="$project" HUB_UPDATE_SERVICE=hub
          export HUB_UPDATE_DATA_VOLUME="${project}_hub-data"
          export HUB_UPDATE_STATE_DIR="$state" HUB_UPDATE_ARCHIVE_DIR="$state/archives"
          export HUB_UPDATE_HEALTH_URL="http://127.0.0.1:$MENU_CAPTURE_HOST_PORT"
          export HUB_UPDATE_HEALTH_USER=admin HUB_UPDATE_HEALTH_PASSWORD="$MENU_CAPTURE_ADMIN_PASSWORD"
          export HUB_UPDATE_BIND=127.0.0.1 HUB_UPDATE_PORT=18767 HUB_UPDATE_HEALTH_TIMEOUT=120
          python3 deploy/hub-update/hub_updater.py > "$state/updater.log" 2>&1 &
          pid=$!
          trap 'status=$?; if [ $status -ne 0 ]; then echo "=== updater.log ==="; cat "$state/updater.log" || true; echo "=== journal ==="; cat "$state/hub-update.json" || true; echo "=== audit ==="; cat "$state/hub-update-audit.jsonl" || true; docker ps -a --format "{{.Names}} {{.Image}} {{.Status}}" || true; "${compose[@]}" logs --no-color --tail 60 || true; fi; kill $pid 2>/dev/null || true' EXIT
          auth="Authorization: Bearer $HUB_UPDATE_TOKEN"
          for _ in $(seq 1 30); do
            curl -fsS -H "$auth" http://127.0.0.1:18767/status > /dev/null && break
            sleep 1
          done
          verify_version() {
            curl --silent --fail -u "admin:$MENU_CAPTURE_ADMIN_PASSWORD" \
              "http://127.0.0.1:$MENU_CAPTURE_HOST_PORT/api/version" | jq -e --arg version "$1" '.version == $version'
          }

          apply=$(jq -nc --arg version "$MENU_CAPTURE_VERSION" --arg archive "$archive" \
            --arg sha "$sha" --argjson size "$size" \
            '{version:$version,confirm:$version,archive:$archive,sha256:$sha,size:$size}')
          curl --silent --fail -H "$auth" -H 'Content-Type: application/json' -d "$apply" \
            http://127.0.0.1:18767/apply | jq -e --arg version "$MENU_CAPTURE_VERSION" \
            '.status == "completed" and .target_version == $version and .previous_version == "0.2.2"'
          verify_version "$MENU_CAPTURE_VERSION"
          "${compose[@]}" exec -T hub grep -q hub-sentinel /var/lib/menu-capture/ota-sentinel

          rollback=$(jq -nc --arg version "$base_version" '{version:$version,confirm:$version}')
          curl --silent --fail -H "$auth" -H 'Content-Type: application/json' -d "$rollback" \
            http://127.0.0.1:18767/rollback | jq -e '.status == "rolled_back"'
          verify_version "$base_version"
          "${compose[@]}" exec -T hub grep -q hub-sentinel /var/lib/menu-capture/ota-sentinel

          # 任意路径、错误确认与未授权请求必须被拒绝，不能落到执行动作。
          bad=$(jq -nc '{version:"9.9.9",confirm:"9.9.9",archive:"../x.tar.gz",sha256:"a",size:1}')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" -H 'Content-Type: application/json' \
            -d "$bad" http://127.0.0.1:18767/apply)
          test "$code" = 400
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d "$rollback" http://127.0.0.1:18767/rollback)
          test "$code" = 401
          "${compose[@]}" down -v
      - name: 推送共享后台镜像到 GHCR 并记录摘要（仅正式发布授权）
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # 只有正式发布授权才允许推送：单纯集成验收不得产生可被客户端拉取的镜像。
          # 推送与摘要属于可选 OCI 交付，任何失败都必须继续完整归档交付。
          registry="ghcr.io"
          repo="${GITHUB_REPOSITORY,,}"
          repository="$registry/$repo"
          remote="$repository:$MENU_CAPTURE_VERSION"
          # 先确认标签状态：已存在说明该版本已正式发布过，禁止用重新构建的镜像覆盖其摘要。
          token=$(curl -fsS -u "$GITHUB_ACTOR:$GHCR_TOKEN" \
            "https://$registry/token?service=$registry&scope=repository:$repo:pull" \
            | jq -r '.token // empty' || true)
          if [ -z "$token" ]; then
            echo "::warning::无法获取 GHCR 只读令牌，跳过 OCI 推送，继续归档交付。"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://$registry/v2/$repo/manifests/$MENU_CAPTURE_VERSION")
          case "$code" in
            200)
              echo "::warning::GHCR 已存在 $remote，保留已发布镜像，跳过推送。"
              exit 0
              ;;
            404) ;;
            *)
              echo "::warning::无法确认 GHCR 标签状态（HTTP $code），为避免覆盖已发布镜像跳过推送，继续归档交付。"
              exit 0
              ;;
          esac
          if ! echo "$GHCR_TOKEN" | docker login "$registry" -u "$GITHUB_ACTOR" --password-stdin; then
            echo "::warning::GHCR 登录失败，跳过 OCI 推送，继续归档交付。"
            exit 0
          fi
          if ! docker tag "$MENU_CAPTURE_IMAGE" "$remote" || ! docker push "$remote"; then
            echo "::warning::GHCR 推送失败，跳过 OCI 摘要，继续归档交付。"
            exit 0
          fi
          # 只采用本仓库固定地址下的 RepoDigest，避免多仓库镜像取到无关摘要。
          digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$MENU_CAPTURE_IMAGE" \
            | awk -v prefix="$repository@" 'index($0, prefix) == 1 && !found {print substr($0, length(prefix) + 1); found = 1}' || true)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::warning::无法获取镜像摘要，跳过 OCI 交付，继续归档交付。"
            exit 0
          fi
          mkdir -p hub-artifacts
          jq -nc --arg registry "$repository" --arg digest "$digest" \
            '{registry:$registry,digest:$digest}' > hub-artifacts/hub-image-digest.json
      - name: 归档共享后台镜像和校验值
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p hub-artifacts
          archive="menu-capture-hub-$MENU_CAPTURE_VERSION-linux-amd64.tar.gz"
          docker image save "$MENU_CAPTURE_IMAGE" | gzip -c > "hub-artifacts/$archive"
          (cd hub-artifacts && sha256sum "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: menu-capture-hub-linux-amd64
          path: hub-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: 容器日志
        if: failure()
        run: docker compose -f deploy/hub/compose.yaml logs

  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.create_release
    # 发布草稿必须依赖全部质量门禁，任一检查失败都不生成发布准备。
    needs: [backend-check, react-web, windows, hub]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: menu-capture-windows-x64
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: menu-capture-hub-linux-amd64
          path: release-assets
      - name: 生成更新清单（update-manifest.json）
        env:
          VERSION: ${{ inputs.version }}
          MIN_SUPPORTED: ${{ inputs.min_supported_version }}
        run: |
          tag="v$VERSION"
          channel="stable"
          case "$VERSION" in *-*) channel="preview" ;; esac
          hub=$(find release-assets -maxdepth 1 -name 'menu-capture-hub-*.tar.gz' -print -quit)
          test -n "$hub" && test -s "$hub.sha256"
          hub_name=$(basename "$hub")
          hub_sha=$(cut -d' ' -f1 < "$hub.sha256")
          hub_size=$(stat -c%s "$hub")
          python3 - "$tag" "$channel" "$GITHUB_SHA" "$MIN_SUPPORTED" \
            "$hub_name" "$hub_size" "$hub_sha" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          from urllib.parse import quote
          sys.path.insert(0, "deploy/windows")
          from velopack_assets import release_assets
          (tag, channel, commit, min_version, hub_name, hub_size, hub_sha) = sys.argv[1:8]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          root = Path("release-assets")
          version = tag.lstrip("v")
          setup_name, full_name, *rest = release_assets(root, version)
          index_name = rest.pop()
          def vp_asset(name):
              path = root / name
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              return {"name": name, "size": path.stat().st_size, "sha256": digest,
                      "url": f"{base}/{quote(name, safe='')}"}
          extension = {
              "schema_version": 1, "pack_id": "Yipu.MenuCapture", "platform": "windows", "arch": "x64",
              "channel": f"win-x64-{channel}", "version": version, "git_commit": commit,
              "setup": vp_asset(setup_name), "full": vp_asset(full_name),
              "deltas": [vp_asset(name) for name in rest], "index": vp_asset(index_name),
              "trust": {"mode": "unsigned"},
          }
          # OCI 是 hub_image 的可选扩展：摘要文件缺失或非法时只影响分层拉取，
          # 完整归档资产照常发布，旧客户端完全不受影响。
          oci = {}
          try:
              with open("release-assets/hub-image-digest.json", encoding="utf-8") as handle:
                  candidate = json.load(handle)
              registry = str(candidate.get("registry") or "")
              digest = str(candidate.get("digest") or "")
              if (registry.startswith("ghcr.io/") and digest.startswith("sha256:")
                      and len(digest) == 71 and all(c in "0123456789abcdef" for c in digest[7:])):
                  oci = {"registry": registry, "digest": digest}
          except (OSError, ValueError):
              oci = {}
          hub_asset = {"kind": "hub_image", "name": hub_name, "size": int(hub_size),
                       "sha256": hub_sha, "url": f"{base}/{hub_name}",
                       "platform": "linux", "arch": "amd64"}
          hub_asset.update(oci)
          manifest = {
              "version": tag.lstrip("v"),
              "channel": channel,
              "git_commit": commit,
              "built_at": os.popen("date -u +%Y-%m-%dT%H:%M:%SZ").read().strip(),
              "min_supported_version": min_version,
              "rollback": "supported",
              "assets": [hub_asset],
              "velopack": extension,
          }
          with open("release-assets/update-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
          PY
          test -s release-assets/update-manifest.json
      - name: 创建或更新发布草稿（复用本次已验收产物）
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v$VERSION"
          prerelease=false
          case "$VERSION" in *-*) prerelease=true ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "Release $tag 已正式发布，拒绝覆盖；请提升版本号。"
              exit 1
            fi
            gh release upload "$tag" release-assets/* --clobber
            gh release edit "$tag" --title "MenuCapture $VERSION" --target "$GITHUB_SHA" --prerelease="$prerelease"
          else
            gh release create "$tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --draft \
              --prerelease="$prerelease" \
              --title "MenuCapture $VERSION" \
              --generate-notes
          fi
