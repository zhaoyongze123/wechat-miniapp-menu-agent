# 本轮开发完成后集中手动验收一次。失败后先本地修复，重跑须用户授权。
# PR、提交、合并和标签推送不会触发。正式发布和生产部署另行授权。
name: Windows 采集端与共享后台（手动集成验收）
on:
  workflow_dispatch:
    inputs:
      version:
        description: 安装包版本
        default: '0.1.0'
        required: true
        type: string
      create_release:
        description: 验收通过后用同一次产物创建或更新 Release 草稿
        default: false
        required: true
        type: boolean
      full_only:
        description: 一次性全量过渡：跳过历史包下载并使用 vpk --delta None，本次不生成 Delta
        default: false
        required: true
        type: boolean
      min_supported_version:
        description: 更新清单中的最低兼容版本（低于该版本不提供应用内更新）
        default: '0.2.0'
        required: true
        type: string
      source_run_id:
        description: 复用已验收候选 run 的产物（仅出发布草稿，不重新构建；留空则本次构建）
        default: ''
        required: false
        type: string

permissions:
  contents: read
  actions: read

# 同一分支与工作流串行执行，不取消正在进行的正式发布或验收。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_ref: ${{ steps.detect.outputs.base_ref }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      prompts: ${{ steps.detect.outputs.prompts }}
      runtime_deps: ${{ steps.detect.outputs.runtime_deps }}
      packaging: ${{ steps.detect.outputs.packaging }}
      hub_deploy: ${{ steps.detect.outputs.hub_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 分析相对上一正式标签或 HEAD~1 的改动分类
        id: detect
        env:
          CREATE_RELEASE: ${{ inputs.create_release }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          def git(*args: str) -> subprocess.CompletedProcess[str]:
              return subprocess.run(["git", *args], capture_output=True, text=True, check=False)

          def emit(values: dict[str, str], files: list[str], note: str = "") -> None:
              out = Path(os.environ["GITHUB_OUTPUT"])
              with out.open("a", encoding="utf-8") as handle:
                  for key, val in values.items():
                      handle.write(f"{key}={val}\n")
              summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
              lines = [
                  "### 变更分类摘要",
                  "",
                  f"- 对比基线：`{values['base_ref']}`",
                  f"- 正式发布草稿（`create_release`）：`{os.environ.get('CREATE_RELEASE', 'false')}`",
                  f"- 变更文件数：`{len(files)}`",
              ]
              if note:
                  lines.append(f"- 说明：{note}")
              lines += [
                  "",
                  "| 分类 | 是否命中 |",
                  "| --- | --- |",
              ]
              for key in ("docs_only", "frontend", "backend", "prompts", "runtime_deps", "packaging", "hub_deploy"):
                  lines.append(f"| `{key}` | `{values[key]}` |")
              summary.write_text("\n".join(lines) + "\n", encoding="utf-8")

          fallback = {
              "base_ref": "unknown",
              "docs_only": "false",
              "frontend": "true",
              "backend": "true",
              "prompts": "true",
              "runtime_deps": "true",
              "packaging": "true",
              "hub_deploy": "true",
          }

          try:
              head = git("rev-parse", "HEAD").stdout.strip()
              base_ref = ""
              tags = git("tag", "--merged", "HEAD", "--sort=-v:refname").stdout.splitlines()
              for tag in tags:
                  tag = tag.strip()
                  if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
                      continue
                  tag_commit = git("rev-parse", f"{tag}^{{commit}}").stdout.strip()
                  if tag_commit and tag_commit != head:
                      base_ref = tag
                      break
              if not base_ref and git("rev-parse", "--verify", "HEAD~1").returncode == 0:
                  base_ref = "HEAD~1"
              if not base_ref:
                  emit(fallback, [], "无法定位对比基线，保守走完整路径。")
                  raise SystemExit(0)

              diff = git("diff", "--name-only", f"{base_ref}..HEAD")
              if diff.returncode != 0:
                  emit(fallback, [], f"git diff 失败（{diff.stderr.strip()}），保守走完整路径。")
                  raise SystemExit(0)

              files = [line.strip() for line in diff.stdout.splitlines() if line.strip()]
              if not files:
                  fallback["base_ref"] = base_ref
                  emit(fallback, [], "对比基线无文件差异，保守走完整路径。")
                  raise SystemExit(0)

              def is_doc(path: str) -> bool:
                  name = Path(path).name
                  return (
                      path.endswith(".md")
                      or path.startswith("docs/")
                      or name in {".gitignore"}
                      or name.startswith("LICENSE")
                  )

              frontend = any(p.startswith(("app/web-react/", "app/web/")) for p in files)
              backend = any(
                  p.startswith(("app/menu_capture/", "app/tests/"))
                  or p in {"app/pyproject.toml", "app/uv.lock"}
                  for p in files
              )
              prompts = any(
                  p.startswith("app/ui_tars/prompts/")
                  or (p.startswith("app/ui_tars/") and p.endswith((".mjs", ".json")))
                  for p in files
              )
              runtime_deps = any(
                  p in {
                      "app/pyproject.toml",
                      "app/uv.lock",
                      "app/ui_tars/package.json",
                      "app/ui_tars/package-lock.json",
                      "deploy/windows/runtimes.json",
                  }
                  for p in files
              )
              packaging = any(p.startswith(("deploy/windows/", ".github/workflows/")) for p in files)
              hub_deploy = any(
                  p.startswith(("deploy/hub/", "deploy/hub-update/", ".github/workflows/"))
                  for p in files
              )
              docs_only = all(is_doc(p) for p in files)

              values = {
                  "base_ref": base_ref,
                  "docs_only": str(docs_only).lower(),
                  "frontend": str(frontend).lower(),
                  "backend": str(backend).lower(),
                  "prompts": str(prompts).lower(),
                  "runtime_deps": str(runtime_deps).lower(),
                  "packaging": str(packaging).lower(),
                  "hub_deploy": str(hub_deploy).lower(),
              }
              note = (
                  "正式发布模式：强制执行全部安全门禁。"
                  if os.environ.get("CREATE_RELEASE") == "true"
                  else (
                      "非正式发布且未改动前端：跳过 react-web 重复 npm test，仅校验提交产物完整性。"
                      if not frontend
                      else "检测到前端改动：执行完整前端构建与单测门禁。"
                  )
              )
              emit(values, files, note)
          except Exception as exc:  # noqa: BLE001 - 任何分析异常默认保守走完整路径
              emit(fallback, [], f"改动分析异常（{exc}），保守走完整路径。")
          PY

  react-web:
    needs: [changes]
    # 复用候选 run 的产物时不再重跑源码门禁，改由 verify-source 核验源 run 与其产物摘要。
    if: ${{ inputs.source_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ inputs.create_release == true || needs.changes.outputs.frontend != 'false' }}
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web-react/package-lock.json
      - name: 校验 React 底座、单测与提交的构建产物
        if: ${{ inputs.create_release == true || needs.changes.outputs.frontend != 'false' }}
        working-directory: app/web-react
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint:design
          npm test
          npm run build
          if [ -n "$(git status --porcelain ../web/react)" ]; then
            echo "web/react 产物与源码不一致，请本地重新构建并提交"
            git status --short ../web/react
            exit 1
          fi
      - name: 非正式发布且无前端改动：跳过重复 npm test（保留产物校验）
        if: ${{ inputs.create_release != true && needs.changes.outputs.frontend == 'false' }}
        run: echo "相对基线 ${{ needs.changes.outputs.base_ref }} 无前端文件变更且 create_release=false，跳过 npm test，继续执行静态产物完整性检查。"
      - name: 校验旧前端已清理且发布产物自包含
        working-directory: app
        run: |
          legacy=$(find web -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' -o -name 'index.html' \) -print)
          if [ -d web/vue ]; then legacy="$legacy web/vue"; fi
          if [ -d web-ui ]; then legacy="$legacy web-ui"; fi
          if [ -n "$legacy" ]; then
            echo "旧前端文件仍在仓库中，请完成清理："
            echo "$legacy"
            exit 1
          fi
          test -s web/react/index.html
          if grep -Eq 'https?://|/react/assets/|__CAPTURE_TOKEN__' web/react/index.html; then
            echo "React 入口包含外部依赖、迁移期资源前缀或旧令牌占位符"
            exit 1
          fi
          test -s web/react/.vite/manifest.json

  backend-check:
    if: ${{ inputs.source_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
          cache-dependency-glob: 'app/uv.lock'
      - name: Ruff 门禁（配置见 pyproject.toml）
        working-directory: app
        run: uvx ruff@0.17.6 check --no-cache .
      - name: 全量通用测试（unit / integration / contract）
        working-directory: app
        run: |
          uv sync --frozen --python 3.12
          # 不再手工维护文件名清单：新增测试随目录自动纳入门禁。
          uv run --frozen pytest -q tests/unit tests/integration tests/contract

  windows:
    # 安装包使用仓库中已提交的前端产物，无需等待门禁；发布仍由 draft 统一等待全部门禁。
    needs: [changes]
    # 复用候选 run 产物时不重新打包，直接下载该 run 的已校验安装包。
    if: ${{ inputs.source_run_id == '' }}
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
          cache-dependency-glob: 'app/uv.lock'
      - name: Windows 原生执行契约
        shell: pwsh
        working-directory: app
        run: |
          uv sync --frozen --python 3.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 通用单测、集成测试与目录级契约已在后端门禁全量执行；这里只补充 Windows 本机行为。
          uv run --frozen pytest -q --basetemp (Join-Path $env:RUNNER_TEMP 'mc-py') tests/contract
      - name: 缓存 Velopack CLI 1.2.161
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-vpk-1.2.161
      - name: 缓存 Windows 运行时下载包
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\mc-runtime-downloads
          key: ${{ runner.os }}-mc-runtime-dl-${{ hashFiles('deploy/windows/runtimes.json') }}
          restore-keys: |
            ${{ runner.os }}-mc-runtime-dl-
      - name: 缓存 Windows 稳定运行环境
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\mc-runtime-env
          key: ${{ runner.os }}-mc-runtime-env-v1-${{ hashFiles('deploy/windows/runtimes.json', 'app/uv.lock', 'app/ui_tars/package-lock.json', 'deploy/windows/prepare_python_bundle.py') }}
      - name: 缓存 Windows 启动器产物
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\mc-launcher-cache
          key: ${{ runner.os }}-mc-launcher-v1-${{ hashFiles('deploy/windows/MenuCaptureLauncher.py', 'app/uv.lock', 'deploy/windows/runtimes.json') }}
      - name: 校验 Velopack CLI 1.2.161
        shell: pwsh
        run: |
          # vpk 与 Python SDK 必须同为 1.2.161。actions/cache 的 key 已固定版本，
          # 命中时只校验可执行文件，避免重复的 dotnet tool list 检查。
          $vpk = Join-Path $env:USERPROFILE '.dotnet\tools\vpk.exe'
          if (-not (Test-Path -LiteralPath $vpk -PathType Leaf)) {
            dotnet tool install -g vpk --version 1.2.161
            if ($LASTEXITCODE -ne 0) { dotnet tool update -g vpk --version 1.2.161 --allow-downgrade }
            if ($LASTEXITCODE -ne 0) { throw 'vpk 1.2.161 安装失败。' }
          }
          if (-not (Test-Path -LiteralPath $vpk -PathType Leaf)) { throw 'vpk 未安装到预期位置。' }
          # 后续脚本按 PATH 解析 vpk；同一作业内保持一致。
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: 构建 Windows x64 安装包（Velopack）
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version || '0.1.0' }}
          GITHUB_TOKEN: ${{ github.token }}
          MC_RUNTIME_CACHE: ${{ runner.temp }}\mc-runtime-downloads
          MC_RUNTIME_ENV_CACHE: ${{ runner.temp }}\mc-runtime-env
          MC_LAUNCHER_CACHE: ${{ runner.temp }}\mc-launcher-cache
          FULL_ONLY: ${{ inputs.full_only }}
        run: |
          $version = $env:BUILD_VERSION
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          # 产物只包含本次版本：Setup、full/delta nupkg 与对应渠道的 releases JSON；
          # 历史包仅用于生成 delta，由构建脚本在临时目录下载，不进入发布资产。
          $fullOnly = $env:FULL_ONLY -eq 'true'
          ./deploy/windows/build.ps1 -Version $version -FullOnly:$fullOnly
      - uses: actions/upload-artifact@v4
        with:
          name: menu-capture-windows-x64
          path: deploy/artifacts/
          if-no-files-found: error
          retention-days: 14

  hub:
    needs: [backend-check, changes]
    # 复用候选 run 产物时不重建镜像，GHCR 由 verify-source 从已归档镜像推送。
    if: ${{ inputs.source_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 仅向 GHCR 推送本仓库镜像；不授予无关写权限。
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 生成隔离环境口令
        run: echo "MENU_CAPTURE_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: 设置共享后台发布标签
        env:
          INPUT_VERSION: ${{ inputs.version || '0.1.0' }}
        run: |
          version="$INPUT_VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          echo "MENU_CAPTURE_VERSION=$version" >> "$GITHUB_ENV"
          echo "MENU_CAPTURE_IMAGE=menu-capture-hub:$version" >> "$GITHUB_ENV"
      - name: 构建共享后台候选镜像（BuildKit + GHA 缓存）
        # 当前 OTA 不验证 BuildKit 默认 provenance，而校验固定仓库、Release 清单和镜像 digest；
        # 显式关闭 provenance/sbom 避免 GHCR 产生未消费的 attestation 清单。
        run: |
          docker buildx build \
            --load \
            --provenance=false \
            --sbom=false \
            --cache-from type=gha,scope=hub \
            --cache-to type=gha,mode=max,scope=hub \
            --build-arg VERSION="$MENU_CAPTURE_VERSION" \
            -t "$MENU_CAPTURE_IMAGE" \
            -f deploy/hub/Dockerfile.hub \
            .
      - name: 验证共享后台容器、前端产物和数据卷
        run: |
          # Bind Mount 由宿主机创建；Linux 运行器需授予容器用户 10001 写权限。
          mkdir -p deploy/hub/delivery && chmod 777 deploy/hub/delivery
          # 直接复用上一步已构建的候选镜像，不再触发二次构建。
          docker compose -f deploy/hub/compose.yaml up --no-build -d --wait
          curl --fail http://127.0.0.1:8766/healthz
          auth="admin:$MENU_CAPTURE_ADMIN_PASSWORD"
          curl --fail -u "$auth" http://127.0.0.1:8766/ | grep -q '<div id="root"></div>'
          curl --fail -u "$auth" http://127.0.0.1:8766/api/version | jq -e --arg version "$MENU_CAPTURE_VERSION" '.version == $version and (.frontend | length > 0)'
          entry=$(curl --fail -u "$auth" http://127.0.0.1:8766/ | grep -o '/assets/[^"]*\.js' | head -n1)
          test -n "$entry" && curl --fail -u "$auth" -o /dev/null "http://127.0.0.1:8766$entry"
          curl --fail -u "$auth" -o /dev/null http://127.0.0.1:8766/favicon.svg
          docker compose -f deploy/hub/compose.yaml exec -T hub tesseract --list-langs | grep -w chi_sim
          docker compose -f deploy/hub/compose.yaml exec -T hub test -s /var/lib/menu-capture/data/tasks.sqlite3
      - name: 验证合格成品目录隔离初始化
        run: |
          # 交付根就是 Bind Mount 本身；项目目录由服务按 项目/<code>/合格 生成。
          # 同时断言旧的扁平 合格/ 结构不会被重新创建。
          auth="admin:$MENU_CAPTURE_ADMIN_PASSWORD"
          status=$(curl --silent --fail -u "$auth" http://127.0.0.1:8766/api/delivery/status)
          jq -e '.configured == true and .state != "error" and .container_root == "/var/lib/menu-delivery" and .host_path == "./delivery"' <<< "$status"
          test -d deploy/hub/delivery
          test ! -e deploy/hub/delivery/合格
      - name: 归档共享后台镜像和校验值（单次归档，供执行器验收与发布复用）
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p hub-artifacts
          archive="menu-capture-hub-$MENU_CAPTURE_VERSION-linux-amd64.tar.gz"
          docker image save "$MENU_CAPTURE_IMAGE" | gzip -c > "hub-artifacts/$archive"
          (cd hub-artifacts && sha256sum "$archive" > "$archive.sha256")
      - name: 加载官方基线镜像（v0.2.2，供升级与执行器验收复用）
        # 风险分级：仅当后端、运行时依赖或 Hub 部署变化时才做历史跨版本验收。
        if: ${{ github.event_name == 'workflow_dispatch' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.hub_deploy == 'true' || needs.changes.outputs.runtime_deps == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_version=0.2.2
          baseline_dir="$RUNNER_TEMP/baseline"
          mkdir -p "$baseline_dir"
          gh release download "v$base_version" --repo "$GITHUB_REPOSITORY" \
            --pattern "menu-capture-hub-$base_version-linux-amd64.tar.gz" --dir "$baseline_dir"
          docker load -i "$baseline_dir/menu-capture-hub-$base_version-linux-amd64.tar.gz"
          docker image inspect "menu-capture-hub:$base_version" > /dev/null
      - name: 验证共享后台原地升级（v0.2.2 → 候选版本）
        if: ${{ github.event_name == 'workflow_dispatch' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.hub_deploy == 'true' || needs.changes.outputs.runtime_deps == 'true') }}
        env:
          MENU_CAPTURE_HOST_PORT: '18777'
        run: |
          set -euo pipefail
          # 直接复用已加载的 v0.2.2 官方发布镜像，避免从历史提交现编基线镜像；
          # 验证既有配对设备在多项目数据库迁移（#102）后的平滑升级与数据保留。
          compose=(docker compose -p menu-capture-upgrade -f deploy/hub/compose.yaml)
          trap '"${compose[@]}" down -v 2>/dev/null || true' EXIT
          candidate="$MENU_CAPTURE_IMAGE"
          base="http://127.0.0.1:$MENU_CAPTURE_HOST_PORT"
          auth="admin:$MENU_CAPTURE_ADMIN_PASSWORD"
          MENU_CAPTURE_IMAGE="menu-capture-hub:0.2.2" "${compose[@]}" up --no-build -d --wait
          session=$(curl --silent --fail -u "$auth" "$base/api/session" | jq -er '.token')
          code=$(curl --silent --fail -u "$auth" -X POST -H "X-Capture-Token: $session" "$base/api/shared/pairing" | jq -er '.code')
          paired=$(curl --silent --fail -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg code "$code" '{code:$code,name:"升级验收设备"}')" "$base/api/shared/worker/pair")
          id=$(jq -er '.id' <<< "$paired")
          token=$(jq -er '.token' <<< "$paired")
          verify_worker() {
            curl --silent --fail -u "$auth" "$base/api/shared/status" | jq -e --arg id "$id" '.workers | any(.id == $id)'
            curl --silent --fail -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              --data '{"ready_ids":[],"pending_uploads":0}' "$base/api/shared/worker/sync" | jq -e 'has("assignments")'
          }
          MENU_CAPTURE_IMAGE="$candidate" "${compose[@]}" up --no-build -d --wait
          verify_worker
          curl --silent --fail -u "$auth" "$base/api/version" | jq -e --arg version "$MENU_CAPTURE_VERSION" '.version == $version'
      - name: Hub 更新执行器契约单测
        run: |
          python3 -m venv "$RUNNER_TEMP/updater-venv"
          "$RUNNER_TEMP/updater-venv/bin/pip" install --quiet pytest
          "$RUNNER_TEMP/updater-venv/bin/python" -m pytest -q deploy/hub-update/test_hub_updater.py
      - name: 验收 Hub 宿主机更新执行器（隔离 Compose）
        if: ${{ github.event_name == 'workflow_dispatch' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.hub_deploy == 'true' || needs.changes.outputs.runtime_deps == 'true') }}
        run: |
          set -euo pipefail
          # 复用已归档的唯一镜像包（无二次 docker image save），通过 HUB_UPDATE_ARCHIVE_DIR 直接指向 hub-artifacts。
          archive="menu-capture-hub-$MENU_CAPTURE_VERSION-linux-amd64.tar.gz"
          archive_path="$PWD/hub-artifacts/$archive"
          test -s "$archive_path" && test -s "$archive_path.sha256"
          size=$(stat -c%s "$archive_path")
          sha=$(cut -d' ' -f1 < "$archive_path.sha256")

          # ---------- 场景 A：真实跨版本升级（0.2.2 → 候选版本）与不兼容 Schema 回滚保护 ----------
          base_version=0.2.2
          project_cross=menu-capture-updater-cross
          compose_cross=(docker compose -p "$project_cross" -f deploy/hub/compose.yaml)
          state_cross="$RUNNER_TEMP/hub-updater-cross"
          mkdir -p "$state_cross"
          MENU_CAPTURE_HOST_PORT=18788 MENU_CAPTURE_IMAGE="menu-capture-hub:$base_version" \
            "${compose_cross[@]}" up --no-build -d --wait
          # 业务数据标记：升级与回滚判定后必须原样保留。
          "${compose_cross[@]}" exec -T hub sh -c 'echo hub-sentinel > /var/lib/menu-capture/ota-sentinel'

          token_cross=$(openssl rand -hex 24)
          (
            export HUB_UPDATE_TOKEN="$token_cross"
            export HUB_UPDATE_COMPOSE_FILE="$PWD/deploy/hub/compose.yaml"
            export HUB_UPDATE_PROJECT="$project_cross" HUB_UPDATE_SERVICE=hub
            export HUB_UPDATE_DATA_VOLUME="${project_cross}_hub-data"
            export HUB_UPDATE_STATE_DIR="$state_cross" HUB_UPDATE_ARCHIVE_DIR="$PWD/hub-artifacts"
            export HUB_UPDATE_HEALTH_URL="http://127.0.0.1:18788"
            export HUB_UPDATE_HEALTH_USER=admin HUB_UPDATE_HEALTH_PASSWORD="$MENU_CAPTURE_ADMIN_PASSWORD"
            export HUB_UPDATE_BIND=127.0.0.1 HUB_UPDATE_PORT=18767 HUB_UPDATE_HEALTH_TIMEOUT=120
            export MENU_CAPTURE_HOST_PORT=18788
            exec python3 deploy/hub-update/hub_updater.py
          ) > "$state_cross/updater.log" 2>&1 &
          pid_cross=$!
          pid_compat=""
          compat_tag=""
          compose_compat=(docker compose -p menu-capture-updater-compat -f deploy/hub/compose.yaml)
          state_compat="$RUNNER_TEMP/hub-updater-compat"

          cleanup() {
            local rc=$?
            if [ $rc -ne 0 ]; then
              for d in "$state_cross" "$state_compat"; do
                if [ -d "$d" ]; then
                  echo "=== $d/updater.log ==="; cat "$d/updater.log" || true
                  echo "=== $d/hub-update.json ==="; cat "$d/hub-update.json" || true
                  echo "=== $d/hub-update-audit.jsonl ==="; cat "$d/hub-update-audit.jsonl" || true
                fi
              done
              docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}' || true
              "${compose_cross[@]}" logs --no-color --tail 60 || true
              "${compose_compat[@]}" logs --no-color --tail 60 || true
            fi
            [ -n "$pid_cross" ] && kill "$pid_cross" 2>/dev/null || true
            [ -n "$pid_compat" ] && kill "$pid_compat" 2>/dev/null || true
            "${compose_cross[@]}" down -v 2>/dev/null || true
            "${compose_compat[@]}" down -v 2>/dev/null || true
            [ -n "$compat_tag" ] && docker rmi "$compat_tag" 2>/dev/null || true
          }
          trap cleanup EXIT

          wait_updater() {
            local port="$1" tok="$2"
            for _ in $(seq 1 30); do
              curl -fsS -H "Authorization: Bearer $tok" "http://127.0.0.1:$port/status" > /dev/null && return 0
              sleep 1
            done
            return 1
          }
          verify_version() {
            local port="$1" expected="$2"
            curl --silent --fail -u "admin:$MENU_CAPTURE_ADMIN_PASSWORD" \
              "http://127.0.0.1:$port/api/version" | jq -e --arg version "$expected" '.version == $version'
          }

          wait_updater 18767 "$token_cross"
          auth_cross="Authorization: Bearer $token_cross"

          apply=$(jq -nc --arg version "$MENU_CAPTURE_VERSION" --arg archive "$archive" \
            --arg sha "$sha" --argjson size "$size" \
            '{version:$version,confirm:$version,archive:$archive,sha256:$sha,size:$size}')
          curl --silent --fail -H "$auth_cross" -H 'Content-Type: application/json' -d "$apply" \
            http://127.0.0.1:18767/apply | jq -e --arg version "$MENU_CAPTURE_VERSION" \
            '.status == "completed" and .target_version == $version and .previous_version == "0.2.2"'
          verify_version 18788 "$MENU_CAPTURE_VERSION"
          "${compose_cross[@]}" exec -T hub grep -q hub-sentinel /var/lib/menu-capture/ota-sentinel

          # 跨版本回滚到 0.2.2：若发生不可逆 schema 扩展（如 #102 为既有表新增 project_id），
          # 执行器按设计返回 409 + needs_manual_recovery 并保持新版运行且数据完整；
          # 若无破坏性 schema 变更则返回 200 + rolled_back。
          rollback_cross=$(jq -nc --arg version "$base_version" '{version:$version,confirm:$version}')
          rollback_resp="$state_cross/rollback-response.json"
          rollback_code=$(curl -s -o "$rollback_resp" -w '%{http_code}' -H "$auth_cross" \
            -H 'Content-Type: application/json' -d "$rollback_cross" http://127.0.0.1:18767/rollback)
          case "$rollback_code" in
            409)
              jq -e '.status == "needs_manual_recovery"' "$rollback_resp"
              curl --silent --fail -H "$auth_cross" http://127.0.0.1:18767/status \
                | jq -e '.status == "needs_manual_recovery"'
              verify_version 18788 "$MENU_CAPTURE_VERSION"
              "${compose_cross[@]}" exec -T hub grep -q hub-sentinel /var/lib/menu-capture/ota-sentinel
              echo "跨版本回滚到 $base_version 已按设计因 schema 不兼容安全阻断，继续运行 $MENU_CAPTURE_VERSION 且数据完整。"
              ;;
            200)
              jq -e '.status == "rolled_back"' "$rollback_resp"
              verify_version 18788 "$base_version"
              "${compose_cross[@]}" exec -T hub grep -q hub-sentinel /var/lib/menu-capture/ota-sentinel
              echo "跨版本回滚到 $base_version 兼容通过并完成回滚。"
              ;;
            *)
              echo "跨版本回滚返回非预期状态码：$rollback_code"
              cat "$rollback_resp" || true
              exit 1
              ;;
          esac

          # 任意路径、错误确认与未授权请求必须被拒绝，不能落到执行动作。
          bad=$(jq -nc '{version:"9.9.9",confirm:"9.9.9",archive:"../x.tar.gz",sha256:"a",size:1}')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$auth_cross" -H 'Content-Type: application/json' \
            -d "$bad" http://127.0.0.1:18767/apply)
          test "$code" = 400
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d "$rollback_cross" http://127.0.0.1:18767/rollback)
          test "$code" = 401

          kill "$pid_cross" 2>/dev/null || true
          wait "$pid_cross" 2>/dev/null || true
          pid_cross=""
          "${compose_cross[@]}" down -v

          # ---------- 场景 B：同 Schema 兼容回滚（模拟同结构旧版 → 候选版本 → 回滚旧版） ----------
          compat_version=$(python3 - "$MENU_CAPTURE_VERSION" <<'PY'
          import sys
          sys.path.insert(0, "deploy/hub-update")
          from hub_updater import HubUpdater
          target = sys.argv[1]
          for candidate in ("0.4.99", "0.0.1"):
              if HubUpdater._compare(target, candidate) > 0:
                  print(candidate)
                  raise SystemExit(0)
          raise SystemExit(f"无法为候选版本 {target} 生成更低的同 schema 模拟旧版")
          PY
          )
          compat_tag="menu-capture-hub:$compat_version"
          # 仅改写镜像配置中的版本标签与环境变量（不重建层、不依赖 buildx builder），使 /api/version 返回模拟旧版号。
          cid=$(docker create "$MENU_CAPTURE_IMAGE")
          docker commit \
            --change "LABEL org.opencontainers.image.version=$compat_version" \
            --change "ENV MENU_CAPTURE_VERSION=$compat_version" \
            "$cid" "$compat_tag" > /dev/null
          docker rm -f "$cid" > /dev/null

          mkdir -p "$state_compat"
          MENU_CAPTURE_HOST_PORT=18789 MENU_CAPTURE_IMAGE="$compat_tag" \
            "${compose_compat[@]}" up --no-build -d --wait
          "${compose_compat[@]}" exec -T hub sh -c 'echo hub-sentinel-compat > /var/lib/menu-capture/ota-sentinel'

          token_compat=$(openssl rand -hex 24)
          (
            export HUB_UPDATE_TOKEN="$token_compat"
            export HUB_UPDATE_COMPOSE_FILE="$PWD/deploy/hub/compose.yaml"
            export HUB_UPDATE_PROJECT=menu-capture-updater-compat HUB_UPDATE_SERVICE=hub
            export HUB_UPDATE_DATA_VOLUME="menu-capture-updater-compat_hub-data"
            export HUB_UPDATE_STATE_DIR="$state_compat" HUB_UPDATE_ARCHIVE_DIR="$PWD/hub-artifacts"
            export HUB_UPDATE_HEALTH_URL="http://127.0.0.1:18789"
            export HUB_UPDATE_HEALTH_USER=admin HUB_UPDATE_HEALTH_PASSWORD="$MENU_CAPTURE_ADMIN_PASSWORD"
            export HUB_UPDATE_BIND=127.0.0.1 HUB_UPDATE_PORT=18768 HUB_UPDATE_HEALTH_TIMEOUT=120
            export MENU_CAPTURE_HOST_PORT=18789
            exec python3 deploy/hub-update/hub_updater.py
          ) > "$state_compat/updater.log" 2>&1 &
          pid_compat=$!

          wait_updater 18768 "$token_compat"
          auth_compat="Authorization: Bearer $token_compat"

          curl --silent --fail -H "$auth_compat" -H 'Content-Type: application/json' -d "$apply" \
            http://127.0.0.1:18768/apply | jq -e --arg version "$MENU_CAPTURE_VERSION" --arg prev "$compat_version" \
            '.status == "completed" and .target_version == $version and .previous_version == $prev'
          verify_version 18789 "$MENU_CAPTURE_VERSION"
          "${compose_compat[@]}" exec -T hub grep -q hub-sentinel-compat /var/lib/menu-capture/ota-sentinel

          rollback_compat=$(jq -nc --arg version "$compat_version" '{version:$version,confirm:$version}')
          curl --silent --fail -H "$auth_compat" -H 'Content-Type: application/json' -d "$rollback_compat" \
            http://127.0.0.1:18768/rollback | jq -e '.status == "rolled_back"'
          verify_version 18789 "$compat_version"
          "${compose_compat[@]}" exec -T hub grep -q hub-sentinel-compat /var/lib/menu-capture/ota-sentinel
      - name: 推送共享后台镜像到 GHCR 并记录摘要（仅正式发布授权）
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # 只有正式发布授权才允许推送：单纯集成验收不得产生可被客户端拉取的镜像。
          # 推送与摘要属于可选 OCI 交付，任何失败都必须继续完整归档交付。
          registry="ghcr.io"
          repo="${GITHUB_REPOSITORY,,}"
          repository="$registry/$repo"
          remote="$repository:$MENU_CAPTURE_VERSION"
          # 先确认标签状态：已存在说明该版本已正式发布过，禁止用重新构建的镜像覆盖其摘要。
          token=$(curl -fsS -u "$GITHUB_ACTOR:$GHCR_TOKEN" \
            "https://$registry/token?service=$registry&scope=repository:$repo:pull" \
            | jq -r '.token // empty' || true)
          if [ -z "$token" ]; then
            echo "::warning::无法获取 GHCR 只读令牌，跳过 OCI 推送，继续归档交付。"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://$registry/v2/$repo/manifests/$MENU_CAPTURE_VERSION")
          case "$code" in
            200)
              echo "::warning::GHCR 已存在 $remote，保留已发布镜像，跳过推送。"
              exit 0
              ;;
            404) ;;
            *)
              echo "::warning::无法确认 GHCR 标签状态（HTTP $code），为避免覆盖已发布镜像跳过推送，继续归档交付。"
              exit 0
              ;;
          esac
          if ! echo "$GHCR_TOKEN" | docker login "$registry" -u "$GITHUB_ACTOR" --password-stdin; then
            echo "::warning::GHCR 登录失败，跳过 OCI 推送，继续归档交付。"
            exit 0
          fi
          if ! docker tag "$MENU_CAPTURE_IMAGE" "$remote" || ! docker push "$remote"; then
            echo "::warning::GHCR 推送失败，跳过 OCI 摘要，继续归档交付。"
            exit 0
          fi
          # 只采用本仓库固定地址下的 RepoDigest，避免多仓库镜像取到无关摘要。
          digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$MENU_CAPTURE_IMAGE" \
            | awk -v prefix="$repository@" 'index($0, prefix) == 1 && !found {print substr($0, length(prefix) + 1); found = 1}' || true)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::warning::无法获取镜像摘要，跳过 OCI 交付，继续归档交付。"
            exit 0
          fi
          mkdir -p hub-artifacts
          jq -nc --arg registry "$repository" --arg digest "$digest" \
            '{registry:$registry,digest:$digest}' > hub-artifacts/hub-image-digest.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: menu-capture-hub-linux-amd64
          path: hub-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: 容器日志
        if: failure()
        run: docker compose -f deploy/hub/compose.yaml logs

  # 只复用已验收候选 run 的产物：不重新构建、不重跑源码门禁，
  # 但必须核验源 run 的成功状态、仓库、工作流、版本、commit 与产物摘要。
  verify-source:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.source_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      commit: ${{ steps.inspect.outputs.commit }}
    steps:
      - name: 核验源 run 身份与结论
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .repository.full_name == $repo
            and .path == ".github/workflows/windows-release.yml"
            and .event == "workflow_dispatch"
            and .status == "completed"
            and .conclusion == "success"
            and (.head_sha | test("^[0-9a-f]{40}$"))
          ' <<<"$run"
          commit=$(jq -r .head_sha <<<"$run")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "源 run $RUN_ID 校验通过，commit=$commit"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.inspect.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: menu-capture-windows-x64
          path: release-assets
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: menu-capture-hub-linux-amd64
          path: release-assets
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: 核验产物摘要、版本、commit 与 FullOnly 契约
        env:
          VERSION: ${{ inputs.version }}
          FULL_ONLY: ${{ inputs.full_only }}
          COMMIT: ${{ steps.inspect.outputs.commit }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum -c ./*.sha256)
          python3 - "$VERSION" "$FULL_ONLY" "$COMMIT" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "app")
          sys.path.insert(0, "deploy/windows")
          from menu_capture.updates.velopack_identity import inner_release_manifest
          from velopack_assets import release_assets
          version, full_only_raw, commit = sys.argv[1:4]
          full_only = full_only_raw == "true"
          root = Path("release-assets")
          setup, full, *rest = release_assets(root, version, full_only=full_only)
          index_name = rest.pop()
          if full_only and rest:
              raise SystemExit(f"FullOnly 源产物包含本次版本 Delta：{rest}")
          stray = sorted(item.name for item in root.glob("*-delta.nupkg"))
          if full_only and stray:
              raise SystemExit(f"FullOnly 源产物目录残留 Delta 文件：{stray}")
          inner = inner_release_manifest(root / full)
          if inner.get("version") != version:
              raise SystemExit(f"包内版本 {inner.get('version')} 与目标版本 {version} 不一致")
          if inner.get("git_commit") != commit:
              raise SystemExit(f"包内 commit {inner.get('git_commit')} 与源 run {commit} 不一致")
          print(f"产物核验通过：{setup} / {full} / {index_name}，Delta 数量 {len(rest)}")
          PY
      - name: 从归档镜像准备 GHCR（不重新构建）
        env:
          GHCR_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          # 只做官方 docker load/tag/push，镜像内容来自源 run 的已归档产物。
          archive=$(find release-assets -maxdepth 1 -name 'menu-capture-hub-*-linux-amd64.tar.gz' -print -quit)
          test -n "$archive"
          (cd release-assets && sha256sum -c "$(basename "$archive").sha256")
          docker load -i "$archive" || exit 1
          image="menu-capture-hub:$VERSION"
          docker image inspect "$image" > /dev/null || exit 1
          registry="ghcr.io"
          repo="${GITHUB_REPOSITORY,,}"
          repository="$registry/$repo"
          remote="$repository:$VERSION"
          token=$(curl -fsS -u "$GITHUB_ACTOR:$GHCR_TOKEN" \
            "https://$registry/token?service=$registry&scope=repository:$repo:pull" \
            | jq -r '.token // empty' || true)
          if [ -z "$token" ]; then
            echo "::warning::无法获取 GHCR 令牌，跳过 OCI 推送，草稿仅含归档镜像。"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://$registry/v2/$repo/manifests/$VERSION")
          case "$code" in
            200)
              echo "::warning::GHCR 已存在 $remote，保留已发布镜像，跳过推送。"
              exit 0
              ;;
            404) ;;
            *)
              echo "::warning::无法确认 GHCR 标签状态（HTTP $code），跳过推送。"
              exit 0
              ;;
          esac
          if ! echo "$GHCR_TOKEN" | docker login "$registry" -u "$GITHUB_ACTOR" --password-stdin; then
            echo "::warning::GHCR 登录失败，跳过 OCI 推送。"
            exit 0
          fi
          if ! docker tag "$image" "$remote" || ! docker push "$remote"; then
            echo "::warning::GHCR 推送失败，跳过 OCI 摘要。"
            exit 0
          fi
          digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image" \
            | awk -v prefix="$repository@" 'index($0, prefix) == 1 && !found {print substr($0, length(prefix) + 1); found = 1}' || true)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::warning::无法获取镜像摘要，跳过 OCI 交付。"
            exit 0
          fi
          mkdir -p hub-oci
          jq -nc --arg registry "$repository" --arg digest "$digest" \
            '{registry:$registry,digest:$digest}' > hub-oci/hub-image-digest.json
      - uses: actions/upload-artifact@v4
        with:
          name: menu-capture-hub-oci
          path: hub-oci/
          if-no-files-found: warn
          retention-days: 14

  draft:
    if: >-
      ${{ always() && inputs.create_release && (
        (inputs.source_run_id != '' && needs.verify-source.result == 'success') ||
        (inputs.source_run_id == '' && needs.backend-check.result == 'success' && needs.react-web.result == 'success'
         && needs.windows.result == 'success' && needs.hub.result == 'success')
      ) }}
    # 发布草稿必须依赖全部质量门禁，任一检查失败都不生成发布准备。
    needs: [verify-source, backend-check, react-web, windows, hub]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      # 复用模式下按产物 commit 检出，确保清单由同版本代码生成。
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-source.outputs.commit || github.sha }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.source_run_id == '' }}
        with:
          name: menu-capture-windows-x64
          path: release-assets
      - uses: actions/download-artifact@v4
        if: ${{ inputs.source_run_id == '' }}
        with:
          name: menu-capture-hub-linux-amd64
          path: release-assets
      - uses: actions/download-artifact@v4
        if: ${{ inputs.source_run_id != '' }}
        with:
          name: menu-capture-windows-x64
          path: release-assets
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.source_run_id != '' }}
        with:
          name: menu-capture-hub-linux-amd64
          path: release-assets
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        # OCI 摘要由本次 verify-source 生成；推送被跳过时不存在，允许缺失。
        if: ${{ inputs.source_run_id != '' }}
        continue-on-error: true
        with:
          name: menu-capture-hub-oci
          path: release-assets
      - name: 生成更新清单（update-manifest.json）
        env:
          VERSION: ${{ inputs.version }}
          MIN_SUPPORTED: ${{ inputs.min_supported_version }}
          FULL_ONLY: ${{ inputs.full_only }}
          # 签名清单必须绑定产物的真实构建 commit，而不是本次发布工作流的 commit。
          SOURCE_COMMIT: ${{ needs.verify-source.outputs.commit || github.sha }}
          MENU_CAPTURE_RELEASE_SIGNING_KEY: ${{ secrets.MENU_CAPTURE_RELEASE_SIGNING_KEY }}
        run: |
          tag="v$VERSION"
          channel="stable"
          case "$VERSION" in *-*) channel="preview" ;; esac
          # 与 app/uv.lock 一致；该临时环境只用于清单签名，不保存私钥或签名环境。
          python3 -m venv "$RUNNER_TEMP/manifest-signing"
          "$RUNNER_TEMP/manifest-signing/bin/python" -m pip install --disable-pip-version-check 'cryptography==46.0.7'
          hub=$(find release-assets -maxdepth 1 -name 'menu-capture-hub-*.tar.gz' -print -quit)
          test -n "$hub" && test -s "$hub.sha256"
          hub_name=$(basename "$hub")
          hub_sha=$(cut -d' ' -f1 < "$hub.sha256")
          hub_size=$(stat -c%s "$hub")
          "$RUNNER_TEMP/manifest-signing/bin/python" - "$tag" "$channel" "$SOURCE_COMMIT" "$MIN_SUPPORTED" \
            "$hub_name" "$hub_size" "$hub_sha" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          from urllib.parse import quote
          sys.path.insert(0, "app")
          sys.path.insert(0, "deploy/windows")
          from menu_capture.updates.velopack_trust import sign_manifest, signing_key_from_env
          from velopack_assets import release_assets
          (tag, channel, commit, min_version, hub_name, hub_size, hub_sha) = sys.argv[1:8]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          root = Path("release-assets")
          version = tag.lstrip("v")
          setup_name, full_name, *rest = release_assets(
              root, version, full_only=os.environ.get("FULL_ONLY") == "true")
          index_name = rest.pop()
          if os.environ.get("FULL_ONLY") == "true" and rest:
              raise SystemExit(f"FullOnly 发布不得包含 Delta：{rest}")
          def vp_asset(name):
              path = root / name
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              return {"name": name, "size": path.stat().st_size, "sha256": digest,
                      "url": f"{base}/{quote(name, safe='')}"}
          extension = {
              "schema_version": 1, "pack_id": "Yipu.MenuCapture", "platform": "windows", "arch": "x64",
              "channel": f"win-x64-{channel}", "version": version, "git_commit": commit, "tag": tag,
              "setup": vp_asset(setup_name), "full": vp_asset(full_name),
              "deltas": [vp_asset(name) for name in rest], "index": vp_asset(index_name),
          }
          # OCI 是 hub_image 的可选扩展：摘要文件缺失或非法时只影响分层拉取，
          # 完整归档资产照常发布，旧客户端完全不受影响。
          oci = {}
          try:
              with open("release-assets/hub-image-digest.json", encoding="utf-8") as handle:
                  candidate = json.load(handle)
              registry = str(candidate.get("registry") or "")
              digest = str(candidate.get("digest") or "")
              if (registry.startswith("ghcr.io/") and digest.startswith("sha256:")
                      and len(digest) == 71 and all(c in "0123456789abcdef" for c in digest[7:])):
                  oci = {"registry": registry, "digest": digest}
          except (OSError, ValueError):
              oci = {}
          hub_asset = {"kind": "hub_image", "name": hub_name, "size": int(hub_size),
                       "sha256": hub_sha, "url": f"{base}/{hub_name}",
                       "platform": "linux", "arch": "amd64"}
          hub_asset.update(oci)
          manifest = {
              "version": tag.lstrip("v"),
              "channel": channel,
              "git_commit": commit,
              "built_at": os.popen("date -u +%Y-%m-%dT%H:%M:%SZ").read().strip(),
              "min_supported_version": min_version,
              "rollback": "supported",
              "assets": [hub_asset],
              "velopack": extension,
          }
          # 密钥缺失、信任根未固定或签名不匹配均终止发布，不生成 unsigned 清单。
          manifest = sign_manifest(manifest, signing_key_from_env())
          with open("release-assets/update-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
          PY
          test -s release-assets/update-manifest.json
      - name: 校验 FullOnly 发布不包含本次 Delta
        if: ${{ inputs.full_only }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if find release-assets -maxdepth 1 -name '*-delta.nupkg' | grep -q .; then
            echo "FullOnly 发布不得包含 Delta 资产"
            find release-assets -maxdepth 1 -name '*-delta.nupkg' -print
            exit 1
          fi
          jq -e '(.velopack.deltas | length) == 0' release-assets/update-manifest.json
          case "$VERSION" in *-*) channel="preview" ;; *) channel="stable" ;; esac
          jq -e --arg v "$VERSION" \
            '[.Assets[] | select(.Version == $v and .Type == "Delta")] | length == 0' \
            "release-assets/releases.win-x64-$channel.json"
      - name: 创建或更新发布草稿（复用本次已验收产物）
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          # 草稿标签指向产物真实构建 commit，避免复用模式下指向发布工作流自身。
          SOURCE_COMMIT: ${{ needs.verify-source.outputs.commit || github.sha }}
        run: |
          tag="v$VERSION"
          prerelease=false
          case "$VERSION" in *-*) prerelease=true ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "Release $tag 已正式发布，拒绝覆盖；请提升版本号。"
              exit 1
            fi
            gh release upload "$tag" release-assets/* --clobber
            gh release edit "$tag" --title "MenuCapture $VERSION" --target "$SOURCE_COMMIT" --prerelease="$prerelease"
          else
            gh release create "$tag" release-assets/* \
              --target "$SOURCE_COMMIT" \
              --draft \
              --prerelease="$prerelease" \
              --title "MenuCapture $VERSION" \
              --generate-notes
          fi
