# Windows 安装包构建及验收。v* 标签只组装待人工审阅的 GitHub Release 草稿。
name: Windows 采集安装与共享后台
on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'UFS_Menu_Scraper/macos_runner/**'
      - '.github/workflows/windows-release.yml'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 安装包版本
        default: '0.1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  react-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: UFS_Menu_Scraper/macos_runner/web-react/package-lock.json
      - name: 校验 React 底座、单测与提交的构建产物
        working-directory: UFS_Menu_Scraper/macos_runner/web-react
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          if [ -n "$(git status --porcelain ../web/react)" ]; then
            echo "web/react 产物与源码不一致，请本地重新构建并提交"
            git status --short ../web/react
            exit 1
          fi
      - name: 校验旧前端已清理且发布产物自包含
        working-directory: UFS_Menu_Scraper/macos_runner
        run: |
          legacy=$(git ls-files 'web/*.js' 'web/*.css' 'web/index.html' 'web/vue/**' 'web-ui/**')
          if [ -n "$legacy" ]; then
            echo "旧前端文件仍在仓库中，请完成清理："
            echo "$legacy"
            exit 1
          fi
          if grep -Eq 'https?://|/react/assets/|__CAPTURE_TOKEN__' web/react/index.html; then
            echo "React 入口包含外部依赖、迁移期资源前缀或旧令牌占位符"
            exit 1
          fi
          test -s web/react/.vite/manifest.json

  windows:
    needs: react-web
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
      - name: Python 回归与 Windows 原生执行契约
        shell: pwsh
        working-directory: UFS_Menu_Scraper/macos_runner
        run: |
          uv sync --frozen --python 3.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 服务端静态资源、共享分配、Windows 兼容、环境诊断、工作台分页与模型用量契约。
          uv run --frozen pytest -q tests/test_server.py tests/test_shared_workbench.py tests/test_windows_compat.py tests/test_environment.py tests/test_workbench_page.py tests/test_model_usage.py tests/test_model_usage_integration.py
      - name: 构建 Windows x64 安装包
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version || '0.1.0' }}
        run: |
          $version = $env:BUILD_VERSION
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          ./deploy/windows/build.ps1 -Version $version
      - name: 验证安装与进程恢复
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version || '0.1.0' }}
        run: |
          $version = $env:BUILD_VERSION
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          $installer = Get-ChildItem deploy/artifacts -Filter '*.exe' -File | Select-Object -First 1
          ./deploy/windows/smoke.ps1 -Installer $installer.FullName -Version $version
      - name: 上传验收日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: menu-capture-smoke-logs
          path: ${{ runner.temp }}/menu-capture-smoke-logs-*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: menu-capture-windows-x64
          path: deploy/artifacts/
          if-no-files-found: error

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成隔离环境口令
        run: echo "MENU_CAPTURE_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: 验证共享后台容器、前端产物和数据卷
        env:
          MENU_CAPTURE_VERSION: '0.1.0'
        run: |
          docker compose -f deploy/compose.yaml up -d --build --wait
          curl --fail http://127.0.0.1:8766/healthz
          auth="admin:$MENU_CAPTURE_ADMIN_PASSWORD"
          curl --fail -u "$auth" http://127.0.0.1:8766/ | grep -q '<div id="root"></div>'
          curl --fail -u "$auth" http://127.0.0.1:8766/api/version | grep -q '"version":"0.1.0"'
          entry=$(curl --fail -u "$auth" http://127.0.0.1:8766/ | grep -o '/assets/[^"]*\.js' | head -n1)
          test -n "$entry" && curl --fail -u "$auth" -o /dev/null "http://127.0.0.1:8766$entry"
          curl --fail -u "$auth" -o /dev/null http://127.0.0.1:8766/favicon.svg
          docker compose -f deploy/compose.yaml exec -T hub tesseract --list-langs | grep -w chi_sim
          docker compose -f deploy/compose.yaml exec -T hub test -s /var/lib/menu-capture/data/tasks.sqlite3
      - name: 容器日志
        if: failure()
        run: docker compose -f deploy/compose.yaml logs

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, hub]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: menu-capture-windows-x64
          path: release-assets
      - name: 创建发布草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --draft --generate-notes
